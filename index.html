<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8.3 Virtual Labs — Link HUD</title>
<style>
  :root{
    --bg:#0b1c33; --panel:#12294a; --panel2:#17355e; --line:#2c4f7e;
    --ink:#eaf2ff; --dim:#9db8dd; --accent:#ffb454; --go:#3ecf7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink);
       font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
       min-height:100vh; padding:28px 22px 40px;}
  header{max-width:1060px; margin:0 auto 26px;}
  h1{font-size:clamp(25px, 3.4vw, 38px); font-weight:800; letter-spacing:.2px;}
  h1 .sub{display:block; font-size:clamp(15px, 2vw, 20px); font-weight:600; color:var(--dim); margin-top:6px;}
  main{max-width:1060px; margin:0 auto; display:grid;
       grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px;}
  .card{background:var(--panel); border:2px solid var(--line); border-radius:16px;
        padding:24px 22px 22px; display:flex; flex-direction:column; gap:10px;}
  .lesson{align-self:flex-start; background:var(--panel2); border:1px solid var(--line);
          color:var(--accent); font-weight:700; font-size:14px; letter-spacing:1.2px;
          text-transform:uppercase; padding:5px 12px; border-radius:999px;}
  .card h2{font-size:27px; font-weight:800; line-height:1.15;}
  .tests{color:var(--dim); font-size:17px; line-height:1.45; flex:1;}
  .launch{display:block; text-align:center; text-decoration:none; cursor:pointer;
          background:var(--go); color:#062b16; font-weight:800; font-size:21px;
          border:none; border-radius:12px; padding:16px 10px; width:100%;}
  .launch:hover,.launch:focus-visible{filter:brightness(1.1); outline:3px solid var(--ink); outline-offset:2px;}
</style>
</head>
<body>
<header>
  <h1>8.3 Forces at a Distance
    <span class="sub">Virtual Labs — Demo HUD. Click a lab to open it in a new tab; this page stays put.</span>
  </h1>
</header>
<main id="cards"></main>

<script>
var LABS = [
  { path:"magnet-distance/", lesson:"Lesson 1",
    name:"Magnet Distance Lab",
    tests:"One pair of magnets, poles flippable. Tests how the force changes with distance: CLOSE vs FAR." },
  { path:"electromagnet/", lesson:"Lesson 4",
    name:"The Electromagnet Lab",
    tests:"A coil of wire that wakes up when the current flows. Tests what makes an electromagnet stronger: more coils, more current." },
  { path:"magnet-size/", lesson:"Lesson 7",
    name:"Magnet Size Lab",
    tests:"Same setup, bigger magnet. Tests whether magnet size changes the force." }
];

function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function render(){
  var main = document.getElementById("cards");
  main.innerHTML = "";
  LABS.forEach(function(lab){
    var card = el("section", "card");
    card.appendChild(el("span", "lesson", lab.lesson));
    card.appendChild(el("h2", null, lab.name));
    card.appendChild(el("p", "tests", lab.tests));
    var a = el("a", "launch", "Open the lab →");
    a.href = lab.path; a.target = "_blank"; a.rel = "noopener";
    card.appendChild(a);
    main.appendChild(card);
  });
}
render();
</script>
</body>
</html>
